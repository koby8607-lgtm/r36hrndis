name: Build R36S USB Ethernet Kernel Modules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build R36S USB Ethernet modules
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Install build dependencies
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            dwarves \
            flex \
            gcc \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            make \
            perl \
            python3 \
            python3-minimal \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip


      # ============================================================
      # Verify host tools
      # ============================================================
      - name: Verify build tools
        shell: bash
        run: |
          set -e

          echo "Host compiler:"
          command -v gcc
          gcc --version

          echo
          echo "ARM64 compiler:"
          command -v aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version

          echo
          echo "Make:"
          command -v make
          make --version | head -n 1

          echo
          echo "Perl:"
          command -v perl
          perl --version | head -n 2

          echo
          echo "Python:"
          command -v python3
          python3 --version

          echo
          echo "Pahole:"
          command -v pahole || true
          pahole --version || true

          echo
          echo "Modinfo:"
          command -v modinfo

          echo
          echo "Depmod:"
          command -v depmod


      # ============================================================
      # Clone kernel
      # ============================================================
      - name: Clone R36S Android kernel
        shell: bash
        run: |
          set -e

          git clone \
            --branch lineage-18.1 \
            https://github.com/andr36oid/android_kernel_gameconsole_r36s.git \
            kernel

          cd kernel

          git submodule update --init --recursive || true

          echo
          echo "========================================"
          echo "KERNEL INFORMATION"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Branch:"
          git branch --show-current


      # ============================================================
      # Restore RTL8188EUS if required
      # ============================================================
      - name: Restore RTL8188EUS source
        working-directory: kernel
        shell: bash
        run: |
          set -e

          RTL_DIR="drivers/net/wireless/realtek/rtl8188eus"

          if [ -f "${RTL_DIR}/Kconfig" ]; then
            echo "rtl8188eus already exists."
            exit 0
          fi

          echo "rtl8188eus is missing."
          echo "Cloning original RG351 kernel..."

          TMP_DIR="$(mktemp -d)"

          cleanup() {
            rm -rf "${TMP_DIR}"
          }

          trap cleanup EXIT

          git clone \
            --depth=1 \
            https://github.com/turtleletortue/android_kernel_anbernic_rg351.git \
            "${TMP_DIR}/rg351"


          echo
          echo "Searching for rtl8188eus..."

          FOUND="$(
            find \
              "${TMP_DIR}/rg351" \
              -type d \
              -name rtl8188eus \
              -print \
              2>/dev/null \
              | head -n 1
          )"


          if [ -z "${FOUND}" ]; then
            echo
            echo "ERROR: rtl8188eus was not found."

            echo
            echo "Available wireless drivers:"

            find \
              "${TMP_DIR}/rg351/drivers/net/wireless" \
              -maxdepth 4 \
              -type d \
              2>/dev/null \
              | sort || true

            exit 1
          fi


          echo "Found:"
          echo "${FOUND}"


          mkdir -p "${RTL_DIR}"

          cp -a \
            "${FOUND}/." \
            "${RTL_DIR}/"


          echo
          echo "Restored files:"

          find \
            "${RTL_DIR}" \
            -maxdepth 2 \
            -type f \
            | sort


      # ============================================================
      # Load kernel configuration
      # ============================================================
      - name: Load kernel configuration
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make lineageos_rg351mp_defconfig


      # ============================================================
      # Detect usbnet Kconfig symbol
      # ============================================================
      - name: Detect USB network configuration
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "USB NETWORK KCONFIG"
          echo "========================================"

          grep -nE \
            '^[[:space:]]*config[[:space:]]+(USB_USBNET|USB_NET|USB_NET_RNDIS_HOST|USB_NET_CDCETHER)([[:space:]]|$)' \
            drivers/net/usb/Kconfig \
            || true


          if grep -qE \
            '^[[:space:]]*config[[:space:]]+USB_USBNET([[:space:]]|$)' \
            drivers/net/usb/Kconfig; then

            echo "USB_NET_CORE=CONFIG_USB_USBNET" >> "${GITHUB_ENV}"

            echo
            echo "Using CONFIG_USB_USBNET"

          elif grep -qE \
            '^[[:space:]]*config[[:space:]]+USB_NET([[:space:]]|$)' \
            drivers/net/usb/Kconfig; then

            echo "USB_NET_CORE=CONFIG_USB_NET" >> "${GITHUB_ENV}"

            echo
            echo "Using CONFIG_USB_NET"

          else

            echo
            echo "ERROR: usbnet Kconfig symbol not found."

            cat drivers/net/usb/Kconfig

            exit 1

          fi


      # ============================================================
      # Configure USB Ethernet
      # ============================================================
      - name: Configure USB Ethernet modules
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-


          echo
          echo "========================================"
          echo "CONFIGURING USB ETHERNET"
          echo "========================================"


          # Basic networking
          ./scripts/config --enable CONFIG_NET
          ./scripts/config --enable CONFIG_INET

          # USB
          ./scripts/config --enable CONFIG_USB

          # usbnet
          ./scripts/config --module "${USB_NET_CORE}"

          # RNDIS host
          ./scripts/config --module CONFIG_USB_NET_RNDIS_HOST

          # CDC Ethernet
          ./scripts/config --module CONFIG_USB_NET_CDCETHER


          # --------------------------------------------------------
          # Disable BTF.
          #
          # This kernel is an old Android kernel and BTF/pahole
          # generation is unnecessary for the modules we need.
          # --------------------------------------------------------

          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF

          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF_MODULES


          echo
          echo "Running olddefconfig..."

          make olddefconfig


          echo
          echo "========================================"
          echo "FINAL USB CONFIGURATION"
          echo "========================================"


          grep -E \
            '^CONFIG_USB=' \
            .config \
            || true

          grep -E \
            '^CONFIG_NET=' \
            .config \
            || true

          grep -E \
            '^CONFIG_INET=' \
            .config \
            || true

          grep -E \
            '^CONFIG_USB_(USBNET|NET)(=|_)' \
            .config \
            || true

          grep \
            '^CONFIG_USB_NET_RNDIS_HOST=' \
            .config \
            || true

          grep \
            '^CONFIG_USB_NET_CDCETHER=' \
            .config \
            || true


          # --------------------------------------------------------
          # Read values
          # --------------------------------------------------------

          USB_NET_VALUE="$(
            grep "^${USB_NET_CORE}=" .config \
              | cut -d= -f2 \
              || true
          )"

          RNDIS_VALUE="$(
            grep '^CONFIG_USB_NET_RNDIS_HOST=' .config \
              | cut -d= -f2 \
              || true
          )"

          CDC_VALUE="$(
            grep '^CONFIG_USB_NET_CDCETHER=' .config \
              | cut -d= -f2 \
              || true
          )"


          echo
          echo "========================================"
          echo "EXACT VALUES"
          echo "========================================"

          echo "${USB_NET_CORE}=${USB_NET_VALUE}"
          echo "CONFIG_USB_NET_RNDIS_HOST=${RNDIS_VALUE}"
          echo "CONFIG_USB_NET_CDCETHER=${CDC_VALUE}"


          # --------------------------------------------------------
          # Verify
          # --------------------------------------------------------

          if [ "${USB_NET_VALUE}" != "m" ]; then
            echo
            echo "ERROR: ${USB_NET_CORE} is not m."
            exit 1
          fi

          if [ "${RNDIS_VALUE}" != "m" ]; then
            echo
            echo "ERROR: CONFIG_USB_NET_RNDIS_HOST is not m."
            exit 1
          fi

          if [ "${CDC_VALUE}" != "m" ]; then
            echo
            echo "ERROR: CONFIG_USB_NET_CDCETHER is not m."
            exit 1
          fi


          echo
          echo "USB Ethernet configuration is correct."


      # ============================================================
      # Prepare kernel build system / modpost
      # ============================================================
      - name: Prepare kernel build system
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-


          echo
          echo "========================================"
          echo "PREPARING KERNEL BUILD SYSTEM"
          echo "========================================"


          # Build the kernel's host-side tools first.
          #
          # In particular this makes sure scripts/mod/modpost
          # exists before the external module build reaches
          # the modpost stage.

          make \
            prepare

          make \
            scripts


          echo
          echo "Checking modpost..."

          if [ ! -x scripts/mod/modpost ]; then

            echo
            echo "ERROR: scripts/mod/modpost was not created."

            echo
            echo "scripts/mod contents:"

            ls -la scripts/mod/ || true

            echo
            echo "scripts contents:"

            ls -la scripts/ | head -100 || true

            exit 1

          fi


          echo
          echo "modpost:"
          file scripts/mod/modpost

          echo
          echo "modpost dependencies:"
          ldd scripts/mod/modpost || true


          echo
          echo "Testing modpost:"

          scripts/mod/modpost \
            --help \
            >/dev/null \
            2>&1 \
            || true


          echo
          echo "modpost exists and is executable."


      # ============================================================
      # Build USB Ethernet modules
      # ============================================================
      - name: Build USB Ethernet modules
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-


          echo
          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          make kernelversion

          echo
          echo "Kernel release:"
          make kernelrelease


          echo
          echo "========================================"
          echo "BUILDING USB ETHERNET MODULES"
          echo "========================================"


          make \
            -j"$(nproc)" \
            M=drivers/net/usb \
            modules


          echo
          echo "========================================"
          echo "CHECKING MODULES"
          echo "========================================"


          for module in \
            usbnet \
            rndis_host \
            cdc_ether
          do

            FILE="drivers/net/usb/${module}.ko"

            if [ ! -f "${FILE}" ]; then
              echo
              echo "ERROR: ${FILE} was not generated."
              exit 1
            fi

            echo
            echo "${FILE}:"
            ls -lh "${FILE}"

          done


      # ============================================================
      # Stage modules
      # ============================================================
      - name: Stage modules
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-


          KERNEL_RELEASE="$(
            make -s kernelrelease
          )"


          MODULE_DIR="../output/lib/modules/${KERNEL_RELEASE}"


          echo "Kernel release:"
          echo "${KERNEL_RELEASE}"


          rm -rf ../output


          mkdir -p \
            "${MODULE_DIR}/kernel/drivers/net/usb"


          cp \
            drivers/net/usb/usbnet.ko \
            "${MODULE_DIR}/kernel/drivers/net/usb/"

          cp \
            drivers/net/usb/rndis_host.ko \
            "${MODULE_DIR}/kernel/drivers/net/usb/"

          cp \
            drivers/net/usb/cdc_ether.ko \
            "${MODULE_DIR}/kernel/drivers/net/usb/"


          echo
          echo "Staged modules:"

          find \
            "${MODULE_DIR}" \
            -type f \
            -print


      # ============================================================
      # Generate module dependency metadata
      # ============================================================
      - name: Generate module dependency metadata
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-


          KERNEL_RELEASE="$(
            make -s kernelrelease
          )"


          MODULE_DIR="../output/lib/modules/${KERNEL_RELEASE}"


          echo
          echo "========================================"
          echo "RUNNING DEPMOD"
          echo "========================================"


          depmod \
            -b ../output \
            "${KERNEL_RELEASE}"


          echo
          echo "========================================"
          echo "modules.dep"
          echo "========================================"

          cat \
            "${MODULE_DIR}/modules.dep"


          echo
          echo "========================================"
          echo "MODULE METADATA"
          echo "========================================"

          find \
            "${MODULE_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


      # ============================================================
      # Verify module metadata
      # ============================================================
      - name: Verify modules
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-


          KERNEL_RELEASE="$(
            make -s kernelrelease
          )"


          MODULE_DIR="../output/lib/modules/${KERNEL_RELEASE}/kernel/drivers/net/usb"


          echo
          echo "========================================"
          echo "MODULE INFORMATION"
          echo "========================================"


          for module in \
            usbnet \
            rndis_host \
            cdc_ether
          do

            FILE="${MODULE_DIR}/${module}.ko"

            echo
            echo "----------------------------------------"
            echo "${module}.ko"
            echo "----------------------------------------"

            test -f "${FILE}"

            modinfo "${FILE}" \
              | grep -E \
                '^(filename|name|depends|vermagic|description):' \
              || true

          done


          # --------------------------------------------------------
          # Vermagic
          # --------------------------------------------------------

          USBNET_VERMAGIC="$(
            modinfo "${MODULE_DIR}/usbnet.ko" \
              | awk -F': ' '$1 == "vermagic" {print $2}'
          )"

          RNDIS_VERMAGIC="$(
            modinfo "${MODULE_DIR}/rndis_host.ko" \
              | awk -F': ' '$1 == "vermagic" {print $2}'
          )"

          CDC_VERMAGIC="$(
            modinfo "${MODULE_DIR}/cdc_ether.ko" \
              | awk -F': ' '$1 == "vermagic" {print $2}'
          )"


          echo
          echo "========================================"
          echo "VERMAGIC"
          echo "========================================"

          echo "usbnet:"
          echo "${USBNET_VERMAGIC}"

          echo
          echo "rndis_host:"
          echo "${RNDIS_VERMAGIC}"

          echo
          echo "cdc_ether:"
          echo "${CDC_VERMAGIC}"


          if [ -z "${USBNET_VERMAGIC}" ]; then
            echo "ERROR: usbnet vermagic is empty."
            exit 1
          fi

          if [ -z "${RNDIS_VERMAGIC}" ]; then
            echo "ERROR: rndis_host vermagic is empty."
            exit 1
          fi

          if [ -z "${CDC_VERMAGIC}" ]; then
            echo "ERROR: cdc_ether vermagic is empty."
            exit 1
          fi


          if [ "${USBNET_VERMAGIC}" != "${RNDIS_VERMAGIC}" ]; then
            echo
            echo "ERROR: usbnet and rndis_host vermagic mismatch."
            exit 1
          fi


          if [ "${USBNET_VERMAGIC}" != "${CDC_VERMAGIC}" ]; then
            echo
            echo "ERROR: usbnet and cdc_ether vermagic mismatch."
            exit 1
          fi


          echo
          echo "All three modules have matching vermagic."


      # ============================================================
      # Prepare release
      # ============================================================
      - name: Prepare release
        shell: bash
        run: |
          set -e


          KERNEL_RELEASE="$(
            make -s -C kernel kernelrelease
          )"


          MODULE_DIR="output/lib/modules/${KERNEL_RELEASE}"


          rm -rf release

          mkdir -p release


          # --------------------------------------------------------
          # Copy modules
          # --------------------------------------------------------

          cp \
            "${MODULE_DIR}/kernel/drivers/net/usb/usbnet.ko" \
            release/

          cp \
            "${MODULE_DIR}/kernel/drivers/net/usb/rndis_host.ko" \
            release/

          cp \
            "${MODULE_DIR}/kernel/drivers/net/usb/cdc_ether.ko" \
            release/


          # --------------------------------------------------------
          # Copy dependency metadata
          # --------------------------------------------------------

          for file in \
            modules.dep \
            modules.dep.bin \
            modules.alias \
            modules.alias.bin \
            modules.symbols \
            modules.symbols.bin \
            modules.softdep
          do

            if [ -f "${MODULE_DIR}/${file}" ]; then

              cp \
                "${MODULE_DIR}/${file}" \
                release/

            fi

          done


          # --------------------------------------------------------
          # Build information
          # --------------------------------------------------------

          echo "${KERNEL_RELEASE}" \
            > release/kernel-release.txt


          git -C kernel rev-parse HEAD \
            > release/kernel-commit.txt


          echo
          echo "========================================"
          echo "RELEASE CONTENTS"
          echo "========================================"


          find \
            release \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


      # ============================================================
      # Create ZIP
      # ============================================================
      - name: Create ZIP
        shell: bash
        run: |
          set -e

          cd release

          zip \
            -9 \
            -r \
            ../r36s-usb-ethernet-modules.zip \
            .

          cd ..


          echo
          echo "========================================"
          echo "ZIP"
          echo "========================================"

          ls -lh \
            r36s-usb-ethernet-modules.zip


      # ============================================================
      # Upload complete module tree
      # ============================================================
      - name: Upload module tree
        uses: actions/upload-artifact@v4
        with:
          name: r36s-usb-ethernet-module-tree
          path: output/lib/modules/


      # ============================================================
      # Upload release files
      # ============================================================
      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: r36s-usb-ethernet-modules
          path: release/


      # ============================================================
      # Upload ZIP
      # ============================================================
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: r36s-usb-ethernet-modules-zip
          path: r36s-usb-ethernet-modules.zip
