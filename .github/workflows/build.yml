name: Build R36S USB Ethernet Kernel Modules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build R36S USB Ethernet modules
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Host dependencies
      # ============================================================
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            make \
            perl \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip


      # ============================================================
      # Verify cross compiler
      # ============================================================
      - name: Check ARM64 compiler
        run: |
          set -e

          aarch64-linux-gnu-gcc --version

          echo
          echo "Compiler:"
          which aarch64-linux-gnu-gcc


      # ============================================================
      # Clone R36S kernel
      # ============================================================
      - name: Clone R36S kernel
        run: |
          set -e

          git clone \
            --branch lineage-18.1 \
            https://github.com/andr36oid/android_kernel_gameconsole_r36s.git \
            kernel

          cd kernel

          git submodule update --init --recursive || true

          echo
          echo "Kernel commit:"
          git rev-parse HEAD

          echo
          echo "Kernel branch:"
          git branch --show-current


      # ============================================================
      # Check RTL8188EUS
      # ============================================================
      - name: Check RTL8188EUS source
        working-directory: kernel
        run: |
          set -e

          if [ -f \
            drivers/net/wireless/realtek/rtl8188eus/Kconfig
          ]; then
            echo "rtl8188eus source is already present."

            find \
              drivers/net/wireless/realtek/rtl8188eus \
              -maxdepth 2 \
              -type f \
              | sort

          else
            echo "rtl8188eus source is missing."
            echo "Will restore it in the next step."
          fi


      # ============================================================
      # Restore RTL8188EUS from RG351 kernel lineage
      # ============================================================
      - name: Restore RTL8188EUS source
        working-directory: kernel
        shell: bash
        run: |
          set -e

          if [ -f \
            drivers/net/wireless/realtek/rtl8188eus/Kconfig
          ]; then
            echo "rtl8188eus already exists."
            exit 0
          fi

          echo "Cloning original RG351 kernel..."

          TMP_DIR="$(mktemp -d)"

          git clone \
            --depth=1 \
            https://github.com/turtleletortue/android_kernel_anbernic_rg351.git \
            "${TMP_DIR}/rg351"

          echo
          echo "Searching for rtl8188eus..."

          FOUND="$(
            find \
              "${TMP_DIR}/rg351" \
              -type d \
              -name rtl8188eus \
              -print \
              2>/dev/null \
              | head -n 1
          )"

          if [ -z "${FOUND}" ]; then
            echo
            echo "ERROR:"
            echo "rtl8188eus was not found in the RG351 kernel."

            echo
            echo "Available Realtek drivers:"
            find \
              "${TMP_DIR}/rg351/drivers/net/wireless" \
              -maxdepth 3 \
              -type d \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          echo "Found:"
          echo "${FOUND}"

          mkdir -p \
            drivers/net/wireless/realtek/rtl8188eus

          cp -a \
            "${FOUND}/." \
            drivers/net/wireless/realtek/rtl8188eus/

          echo
          echo "Restored files:"
          find \
            drivers/net/wireless/realtek/rtl8188eus \
            -maxdepth 2 \
            -type f \
            | sort

          rm -rf "${TMP_DIR}"


      # ============================================================
      # Configure kernel
      # ============================================================
      - name: Configure kernel
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "Loading:"
          echo "lineageos_rg351mp_defconfig"

          make lineageos_rg351mp_defconfig


          echo
          echo "Enabling USB Ethernet modules..."

          ./scripts/config --module CONFIG_USB_NET
          ./scripts/config --module CONFIG_USB_NET_RNDIS_HOST
          ./scripts/config --module CONFIG_USB_NET_CDCETHER


          echo
          echo "Resolving dependencies..."

          make olddefconfig


          echo
          echo "USB networking configuration:"
          echo "--------------------------------"

          grep -E \
            '^CONFIG_USB_NET=|^CONFIG_USB_NET_RNDIS_HOST=|^CONFIG_USB_NET_CDCETHER=' \
            .config


          echo
          echo "Checking configuration..."

          test "$(grep '^CONFIG_USB_NET=' .config | cut -d= -f2)" = "m"

          test "$(grep '^CONFIG_USB_NET_RNDIS_HOST=' .config | cut -d= -f2)" = "m"

          test "$(grep '^CONFIG_USB_NET_CDCETHER=' .config | cut -d= -f2)" = "m"

          echo
          echo "Configuration OK."


      # ============================================================
      # Build modules
      # ============================================================
      - name: Build USB Ethernet modules
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "Kernel version:"
          make kernelversion

          echo
          echo "Kernel release:"
          make kernelrelease

          echo
          echo "Building drivers/net/usb..."

          make -j"$(nproc)" \
            M=drivers/net/usb \
            modules


          echo
          echo "Checking generated modules..."

          test -f drivers/net/usb/usbnet.ko
          test -f drivers/net/usb/rndis_host.ko
          test -f drivers/net/usb/cdc_ether.ko


          ls -lh \
            drivers/net/usb/usbnet.ko \
            drivers/net/usb/rndis_host.ko \
            drivers/net/usb/cdc_ether.ko


      # ============================================================
      # Stage modules
      # ============================================================
      - name: Stage modules
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          KERNEL_RELEASE="$(make -s kernelrelease)"

          echo "Kernel release:"
          echo "${KERNEL_RELEASE}"

          rm -rf ../output

          mkdir -p \
            "../output/lib/modules/${KERNEL_RELEASE}/kernel/drivers/net/usb"


          cp \
            drivers/net/usb/usbnet.ko \
            "../output/lib/modules/${KERNEL_RELEASE}/kernel/drivers/net/usb/"

          cp \
            drivers/net/usb/rndis_host.ko \
            "../output/lib/modules/${KERNEL_RELEASE}/kernel/drivers/net/usb/"

          cp \
            drivers/net/usb/cdc_ether.ko \
            "../output/lib/modules/${KERNEL_RELEASE}/kernel/drivers/net/usb/"


      # ============================================================
      # Generate dependencies
      # ============================================================
      - name: Generate module dependencies
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          KERNEL_RELEASE="$(make -s kernelrelease)"

          depmod \
            -b ../output \
            "${KERNEL_RELEASE}"


          echo
          echo "modules.dep:"
          echo "================================"

          cat \
            "../output/lib/modules/${KERNEL_RELEASE}/modules.dep"


          echo
          echo "Generated files:"
          echo "================================"

          find \
            "../output/lib/modules/${KERNEL_RELEASE}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


      # ============================================================
      # Verify modules
      # ============================================================
      - name: Verify modules
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          KERNEL_RELEASE="$(make -s kernelrelease)"

          MODULE_DIR="../output/lib/modules/${KERNEL_RELEASE}/kernel/drivers/net/usb"


          echo "================================"
          echo "usbnet.ko"
          echo "================================"

          modinfo \
            "${MODULE_DIR}/usbnet.ko" \
            | grep -E \
              '^(filename|name|depends|vermagic|description):' \
            || true


          echo
          echo "================================"
          echo "rndis_host.ko"
          echo "================================"

          modinfo \
            "${MODULE_DIR}/rndis_host.ko" \
            | grep -E \
              '^(filename|name|depends|vermagic|description):' \
            || true


          echo
          echo "================================"
          echo "cdc_ether.ko"
          echo "================================"

          modinfo \
            "${MODULE_DIR}/cdc_ether.ko" \
            | grep -E \
              '^(filename|name|depends|vermagic|description):' \
            || true


          echo
          echo "================================"
          echo "Checking vermagic"
          echo "================================"


          USBNET_VERMAGIC="$(
            modinfo "${MODULE_DIR}/usbnet.ko" \
              | awk -F': ' '$1 == "vermagic" {print $2}'
          )"

          RNDIS_VERMAGIC="$(
            modinfo "${MODULE_DIR}/rndis_host.ko" \
              | awk -F': ' '$1 == "vermagic" {print $2}'
          )"

          CDC_VERMAGIC="$(
            modinfo "${MODULE_DIR}/cdc_ether.ko" \
              | awk -F': ' '$1 == "vermagic" {print $2}'
          )"


          echo "usbnet:      ${USBNET_VERMAGIC}"
          echo "rndis_host:  ${RNDIS_VERMAGIC}"
          echo "cdc_ether:   ${CDC_VERMAGIC}"


          test -n "${USBNET_VERMAGIC}"
          test -n "${RNDIS_VERMAGIC}"
          test -n "${CDC_VERMAGIC}"


          test "${USBNET_VERMAGIC}" = "${RNDIS_VERMAGIC}"
          test "${USBNET_VERMAGIC}" = "${CDC_VERMAGIC}"


          echo
          echo "All three modules have matching vermagic."


      # ============================================================
      # Prepare release
      # ============================================================
      - name: Prepare release
        shell: bash
        run: |
          set -e

          KERNEL_RELEASE="$(
            make -s -C kernel kernelrelease
          )

          MODULE_DIR="output/lib/modules/${KERNEL_RELEASE}"

          rm -rf release

          mkdir -p release


          # Main modules
          cp \
            "${MODULE_DIR}/kernel/drivers/net/usb/usbnet.ko" \
            release/

          cp \
            "${MODULE_DIR}/kernel/drivers/net/usb/rndis_host.ko" \
            release/

          cp \
            "${MODULE_DIR}/kernel/drivers/net/usb/cdc_ether.ko" \
            release/


          # Dependency information
          for file in \
            modules.dep \
            modules.dep.bin \
            modules.alias \
            modules.alias.bin \
            modules.symbols \
            modules.symbols.bin \
            modules.softdep
          do
            if [ -f "${MODULE_DIR}/${file}" ]; then
              cp "${MODULE_DIR}/${file}" release/
            fi
          done


          # Build information
          echo "${KERNEL_RELEASE}" \
            > release/kernel-release.txt

          git -C kernel rev-parse HEAD \
            > release/kernel-commit.txt


          echo
          echo "Release contents:"
          find release \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


      # ============================================================
      # ZIP
      # ============================================================
      - name: Create ZIP
        run: |
          set -e

          cd release

          zip -9 -r \
            ../r36s-usb-ethernet-modules.zip \
            .

          cd ..

          ls -lh \
            r36s-usb-ethernet-modules.zip


      # ============================================================
      # Upload complete module tree
      # ============================================================
      - name: Upload module tree
        uses: actions/upload-artifact@v4
        with:
          name: r36s-usb-ethernet-module-tree
          path: output/lib/modules/


      # ============================================================
      # Upload individual release
      # ============================================================
      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: r36s-usb-ethernet-modules
          path: release/


      # ============================================================
      # Upload ZIP
      # ============================================================
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: r36s-usb-ethernet-modules-zip
          path: r36s-usb-ethernet-modules.zip
