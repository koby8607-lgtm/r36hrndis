name: Build R36S USB Ethernet Kernel Modules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build R36S USB Ethernet modules
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # Checkout this repository
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Install build dependencies
      # ============================================================
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            make \
            perl \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip


      # ============================================================
      # Verify compiler
      # ============================================================
      - name: Verify ARM64 compiler
        run: |
          set -e

          echo "ARM64 compiler:"
          which aarch64-linux-gnu-gcc

          echo
          aarch64-linux-gnu-gcc --version


      # ============================================================
      # Clone R36S Android kernel
      # ============================================================
      - name: Clone R36S Android kernel
        run: |
          set -e

          git clone \
            --branch lineage-18.1 \
            https://github.com/andr36oid/android_kernel_gameconsole_r36s.git \
            kernel

          cd kernel

          git submodule update --init --recursive || true

          echo
          echo "========================================"
          echo "KERNEL INFORMATION"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Branch:"
          git branch --show-current


      # ============================================================
      # Check RTL8188EUS
      # ============================================================
      - name: Check RTL8188EUS source
        working-directory: kernel
        shell: bash
        run: |
          set -e

          if [ -f \
            drivers/net/wireless/realtek/rtl8188eus/Kconfig
          ]; then

            echo "rtl8188eus source is already present."

          else

            echo "rtl8188eus source is missing."

            echo
            echo "Searching for rtl8188eus references:"

            grep -R \
              "rtl8188eus" \
              -n \
              drivers/net/wireless \
              arch/arm64/configs \
              2>/dev/null \
              || true

          fi


      # ============================================================
      # Restore RTL8188EUS if missing
      # ============================================================
      - name: Restore RTL8188EUS source
        working-directory: kernel
        shell: bash
        run: |
          set -e

          if [ -f \
            drivers/net/wireless/realtek/rtl8188eus/Kconfig
          ]; then

            echo "rtl8188eus already exists."
            exit 0

          fi

          echo "Cloning original RG351 kernel..."

          TMP_DIR="$(mktemp -d)"

          git clone \
            --depth=1 \
            https://github.com/turtleletortue/android_kernel_anbernic_rg351.git \
            "${TMP_DIR}/rg351"


          echo
          echo "Searching for rtl8188eus..."

          FOUND="$(
            find \
              "${TMP_DIR}/rg351" \
              -type d \
              -name rtl8188eus \
              -print \
              2>/dev/null \
              | head -n 1
          )"


          if [ -z "${FOUND}" ]; then

            echo
            echo "ERROR: rtl8188eus was not found."
            echo

            echo "Available wireless driver directories:"

            find \
              "${TMP_DIR}/rg351/drivers/net/wireless" \
              -maxdepth 3 \
              -type d \
              2>/dev/null \
              | sort \
              || true

            exit 1

          fi


          echo "Found:"
          echo "${FOUND}"


          mkdir -p \
            drivers/net/wireless/realtek/rtl8188eus


          cp -a \
            "${FOUND}/." \
            drivers/net/wireless/realtek/rtl8188eus/


          echo
          echo "Restored rtl8188eus files:"

          find \
            drivers/net/wireless/realtek/rtl8188eus \
            -maxdepth 2 \
            -type f \
            | sort


          rm -rf "${TMP_DIR}"


      # ============================================================
      # Load the correct Android kernel configuration
      # ============================================================
      - name: Load RG351MP kernel configuration
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "Loading:"
          echo "  lineageos_rg351mp_defconfig"

          make lineageos_rg351mp_defconfig


      # ============================================================
      # Inspect USB networking Kconfig
      # ============================================================
      - name: Inspect USB networking Kconfig
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "USB NETWORK KCONFIG"
          echo "========================================"

          echo
          echo "USB network configuration symbols:"

          grep -nE \
            'config USB_(USB)?NET|config USB_NET_' \
            drivers/net/usb/Kconfig \
            || true


          echo
          echo "Relevant Kconfig definitions:"

          grep -nE \
            -A12 \
            -B3 \
            'config USB_NET|config USB_USBNET|config USB_NET_RNDIS_HOST|config USB_NET_CDCETHER' \
            drivers/net/usb/Kconfig \
            || true


      # ============================================================
      # Determine actual usbnet core symbol
      # ============================================================
      - name: Determine USB network core symbol
        working-directory: kernel
        shell: bash
        run: |
          set -e

          if grep -qE '^config USB_USBNET([[:space:]]|$)' \
            drivers/net/usb/Kconfig; then

            echo "USB_NET_CORE=CONFIG_USB_USBNET" \
              >> "${GITHUB_ENV}"

            echo "Detected USB network core:"
            echo "CONFIG_USB_USBNET"

          elif grep -qE '^config USB_NET([[:space:]]|$)' \
            drivers/net/usb/Kconfig; then

            echo "USB_NET_CORE=CONFIG_USB_NET" \
              >> "${GITHUB_ENV}"

            echo "Detected USB network core:"
            echo "CONFIG_USB_NET"

          else

            echo
            echo "ERROR:"
            echo "Could not find the usbnet core Kconfig symbol."

            echo
            echo "drivers/net/usb/Kconfig:"

            cat drivers/net/usb/Kconfig

            exit 1

          fi


      # ============================================================
      # Configure USB Ethernet modules
      # ============================================================
      - name: Configure USB Ethernet modules
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-


          echo
          echo "========================================"
          echo "CONFIGURING USB ETHERNET"
          echo "========================================"


          echo
          echo "USB network core:"
          echo "${USB_NET_CORE}"


          # --------------------------------------------------------
          # Basic networking
          # --------------------------------------------------------

          ./scripts/config \
            --enable CONFIG_NET

          ./scripts/config \
            --enable CONFIG_INET


          # --------------------------------------------------------
          # USB core
          # --------------------------------------------------------

          ./scripts/config \
            --enable CONFIG_USB


          # --------------------------------------------------------
          # USB network core
          # --------------------------------------------------------

          ./scripts/config \
            --module "${USB_NET_CORE}"


          # --------------------------------------------------------
          # RNDIS host
          # --------------------------------------------------------

          ./scripts/config \
            --module CONFIG_USB_NET_RNDIS_HOST


          # --------------------------------------------------------
          # CDC Ethernet
          # --------------------------------------------------------

          ./scripts/config \
            --module CONFIG_USB_NET_CDCETHER


          echo
          echo "Running olddefconfig..."

          make olddefconfig


          echo
          echo "========================================"
          echo "FINAL USB CONFIGURATION"
          echo "========================================"


          echo
          echo "USB core:"

          grep \
            '^CONFIG_USB=' \
            .config \
            || true


          echo
          echo "Networking:"

          grep \
            '^CONFIG_NET=' \
            .config \
            || true

          grep \
            '^CONFIG_INET=' \
            .config \
            || true


          echo
          echo "USB networking:"

          grep -E \
            '^CONFIG_USB_(USB)?NET(=|_)' \
            .config \
            || true

          grep \
            '^CONFIG_USB_NET_RNDIS_HOST=' \
            .config \
            || true

          grep \
            '^CONFIG_USB_NET_CDCETHER=' \
            .config \
            || true


          # ========================================================
          # Read actual final values
          # ========================================================

          USB_NET_VALUE="$(
            grep "^${USB_NET_CORE}=" .config \
              | cut -d= -f2 \
              || true
          )"


          RNDIS_VALUE="$(
            grep '^CONFIG_USB_NET_RNDIS_HOST=' .config \
              | cut -d= -f2 \
              || true
          )"


          CDC_VALUE="$(
            grep '^CONFIG_USB_NET_CDCETHER=' .config \
              | cut -d= -f2 \
              || true
          )"


          echo
          echo "========================================"
          echo "EXACT FINAL VALUES"
          echo "========================================"

          echo "${USB_NET_CORE}=${USB_NET_VALUE}"
          echo "CONFIG_USB_NET_RNDIS_HOST=${RNDIS_VALUE}"
          echo "CONFIG_USB_NET_CDCETHER=${CDC_VALUE}"


          # ========================================================
          # If Kconfig changed anything, dump useful information
          # ========================================================

          if [ "${USB_NET_VALUE}" != "m" ] || \
             [ "${RNDIS_VALUE}" != "m" ] || \
             [ "${CDC_VALUE}" != "m" ]; then

            echo
            echo "========================================"
            echo "KCONFIG DEPENDENCY FAILURE"
            echo "========================================"

            echo
            echo "Relevant configuration:"

            grep -E \
              '^CONFIG_(NET|INET|USB|USB_SUPPORT|USB_NET)' \
              .config \
              || true


            echo
            echo "USB network Kconfig:"

            grep -nE \
              -A20 \
              -B5 \
              'config USB_NET|config USB_USBNET|config USB_NET_RNDIS_HOST|config USB_NET_CDCETHER' \
              drivers/net/usb/Kconfig \
              || true


            echo
            echo "The requested drivers were not all configured"
            echo "as modules."

            exit 1

          fi


          echo
          echo "========================================"
          echo "CONFIGURATION SUCCESS"
          echo "========================================"

          echo "${USB_NET_CORE}=m"
          echo "CONFIG_USB_NET_RNDIS_HOST=m"
          echo "CONFIG_USB_NET_CDCETHER=m"


      # ============================================================
      # Build USB Ethernet modules
      # ============================================================
      - name: Build USB Ethernet modules
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-


          echo
          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          echo "Kernel version:"
          make kernelversion

          echo
          echo "Kernel release:"
          make kernelrelease


          echo
          echo "========================================"
          echo "BUILDING USB NETWORK MODULES"
          echo "========================================"


          make -j"$(nproc)" \
            M=drivers/net/usb \
            modules


          echo
          echo "========================================"
          echo "CHECKING GENERATED MODULES"
          echo "========================================"


          test -f \
            drivers/net/usb/usbnet.ko

          test -f \
            drivers/net/usb/rndis_host.ko

          test -f \
            drivers/net/usb/cdc_ether.ko


          echo
          echo "Generated modules:"

          ls -lh \
            drivers/net/usb/usbnet.ko \
            drivers/net/usb/rndis_host.ko \
            drivers/net/usb/cdc_ether.ko


      # ============================================================
      # Stage modules
      # ============================================================
      - name: Stage modules
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-


          KERNEL_RELEASE="$(
            make -s kernelrelease
          )"


          echo "Kernel release:"
          echo "${KERNEL_RELEASE}"


          rm -rf ../output


          MODULE_DIR="../output/lib/modules/${KERNEL_RELEASE}"


          mkdir -p \
            "${MODULE_DIR}/kernel/drivers/net/usb"


          cp \
            drivers/net/usb/usbnet.ko \
            "${MODULE_DIR}/kernel/drivers/net/usb/"

          cp \
            drivers/net/usb/rndis_host.ko \
            "${MODULE_DIR}/kernel/drivers/net/usb/"

          cp \
            drivers/net/usb/cdc_ether.ko \
            "${MODULE_DIR}/kernel/drivers/net/usb/"


          echo
          echo "Staged modules:"

          find \
            "${MODULE_DIR}" \
            -type f \
            -print


      # ============================================================
      # Generate depmod metadata
      # ============================================================
      - name: Generate module dependencies
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-


          KERNEL_RELEASE="$(
            make -s kernelrelease
          )"


          MODULE_DIR="../output/lib/modules/${KERNEL_RELEASE}"


          echo
          echo "========================================"
          echo "RUNNING DEPMOD"
          echo "========================================"


          depmod \
            -b ../output \
            "${KERNEL_RELEASE}"


          echo
          echo "========================================"
          echo "modules.dep"
          echo "========================================"

          cat \
            "${MODULE_DIR}/modules.dep"


          echo
          echo "========================================"
          echo "GENERATED MODULE METADATA"
          echo "========================================"

          find \
            "${MODULE_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


      # ============================================================
      # Verify modules
      # ============================================================
      - name: Verify modules
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-


          KERNEL_RELEASE="$(
            make -s kernelrelease
          )"


          MODULE_DIR="../output/lib/modules/${KERNEL_RELEASE}/kernel/drivers/net/usb"


          for module in \
            usbnet \
            rndis_host \
            cdc_ether
          do

            FILE="${MODULE_DIR}/${module}.ko"


            echo
            echo "========================================"
            echo "${module}.ko"
            echo "========================================"


            test -f "${FILE}"


            modinfo "${FILE}" \
              | grep -E \
                '^(filename|name|depends|vermagic|description):' \
              || true

          done


          # ========================================================
          # Read vermagic
          # ========================================================

          USBNET_VERMAGIC="$(
            modinfo "${MODULE_DIR}/usbnet.ko" \
              | awk -F': ' '$1 == "vermagic" {print $2}'
          )"


          RNDIS_VERMAGIC="$(
            modinfo "${MODULE_DIR}/rndis_host.ko" \
              | awk -F': ' '$1 == "vermagic" {print $2}'
          )"


          CDC_VERMAGIC="$(
            modinfo "${MODULE_DIR}/cdc_ether.ko" \
              | awk -F': ' '$1 == "vermagic" {print $2}'
          )"


          echo
          echo "========================================"
          echo "VERMAGIC"
          echo "========================================"

          echo "usbnet:"
          echo "${USBNET_VERMAGIC}"

          echo
          echo "rndis_host:"
          echo "${RNDIS_VERMAGIC}"

          echo
          echo "cdc_ether:"
          echo "${CDC_VERMAGIC}"


          # ========================================================
          # Verify vermagic exists
          # ========================================================

          if [ -z "${USBNET_VERMAGIC}" ] || \
             [ -z "${RNDIS_VERMAGIC}" ] || \
             [ -z "${CDC_VERMAGIC}" ]; then

            echo
            echo "ERROR: One or more modules have no vermagic."

            exit 1

          fi


          # ========================================================
          # Verify vermagic matches
          # ========================================================

          if [ "${USBNET_VERMAGIC}" != "${RNDIS_VERMAGIC}" ]; then

            echo
            echo "ERROR:"
            echo "usbnet.ko and rndis_host.ko have different vermagic."

            exit 1

          fi


          if [ "${USBNET_VERMAGIC}" != "${CDC_VERMAGIC}" ]; then

            echo
            echo "ERROR:"
            echo "usbnet.ko and cdc_ether.ko have different vermagic."

            exit 1

          fi


          echo
          echo "All three modules have matching vermagic."


      # ============================================================
      # Prepare release files
      # ============================================================
      - name: Prepare release
        run: |
          set -e

          KERNEL_RELEASE="$(
            make -s -C kernel kernelrelease
          )"


          MODULE_DIR="output/lib/modules/${KERNEL_RELEASE}"


          rm -rf release

          mkdir -p release


          # --------------------------------------------------------
          # Modules
          # --------------------------------------------------------

          cp \
            "${MODULE_DIR}/kernel/drivers/net/usb/usbnet.ko" \
            release/

          cp \
            "${MODULE_DIR}/kernel/drivers/net/usb/rndis_host.ko" \
            release/

          cp \
            "${MODULE_DIR}/kernel/drivers/net/usb/cdc_ether.ko" \
            release/


          # --------------------------------------------------------
          # depmod metadata
          # --------------------------------------------------------

          for file in \
            modules.dep \
            modules.dep.bin \
            modules.alias \
            modules.alias.bin \
            modules.symbols \
            modules.symbols.bin \
            modules.softdep
          do

            if [ -f "${MODULE_DIR}/${file}" ]; then

              cp \
                "${MODULE_DIR}/${file}" \
                release/

            fi

          done


          # --------------------------------------------------------
          # Build information
          # --------------------------------------------------------

          echo "${KERNEL_RELEASE}" \
            > release/kernel-release.txt


          git -C kernel rev-parse HEAD \
            > release/kernel-commit.txt


          echo
          echo "========================================"
          echo "RELEASE CONTENTS"
          echo "========================================"


          find \
            release \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


      # ============================================================
      # Create ZIP
      # ============================================================
      - name: Create ZIP
        run: |
          set -e

          cd release

          zip -9 -r \
            ../r36s-usb-ethernet-modules.zip \
            .

          cd ..


          echo
          echo "========================================"
          echo "ZIP CREATED"
          echo "========================================"

          ls -lh \
            r36s-usb-ethernet-modules.zip


      # ============================================================
      # Upload complete module tree
      # ============================================================
      - name: Upload module tree
        uses: actions/upload-artifact@v4
        with:
          name: r36s-usb-ethernet-module-tree
          path: output/lib/modules/


      # ============================================================
      # Upload release files
      # ============================================================
      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: r36s-usb-ethernet-modules
          path: release/


      # ============================================================
      # Upload ZIP
      # ============================================================
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: r36s-usb-ethernet-modules-zip
          path: r36s-usb-ethernet-modules.zip
